site_name: Documentation Portal

theme:
  name: material
  logo: logo.svg
  favicon: logo-hero.svg
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

plugins:
  - search
  - awesome-pages
  
extra:
  scope: /

extra_css:
  - styles.css
