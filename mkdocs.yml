site_name: Documentation Portal

theme:
  name: material
  logo: logo.png
  favicon: logo.png
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

plugins:
  - search
  - awesome-pages

extra_css:
  - styles.css

nav:
  - Home: index.md
  - Project Docs: projects/index.md